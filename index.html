<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Honey Jar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 320px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        p {
            color: #666;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .instruction {
            font-size: 14px;
            font-style: italic;
            color: #888;
            margin-top: 10px;
        }

        #features-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 320px;
            backdrop-filter: blur(10px);
            opacity: 0.3;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        #features-panel.active {
            opacity: 1;
            pointer-events: all;
        }

        .feature {
            margin-bottom: 20px;
        }

        .feature h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 18px;
        }

        #interaction-count {
            font-size: 36px;
            font-weight: bold;
            color: #764ba2;
            text-align: center;
            margin: 10px 0;
        }

        #color-picker-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #color-picker {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #color-label {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .locked-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            #info-panel, #features-panel {
                max-width: 90%;
                left: 50%;
                transform: translateX(-50%);
            }

            #features-panel {
                top: auto;
                bottom: 20px;
                right: auto;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1>🍯 Interactive Honey Jar</h1>
            <p>Welcome! Drag to rotate the honey jar and explore its 3D beauty.</p>
            <p class="instruction">Interact with the jar to unlock special features!</p>
        </div>

        <div id="features-panel">
            <div class="feature">
                <h3>📊 Interaction Counter</h3>
                <div id="interaction-count">0</div>
                <p style="text-align: center; font-size: 12px;">Total interactions</p>
            </div>
            <div class="feature">
                <h3>🎨 Honey Color Picker</h3>
                <div id="color-picker-container">
                    <input type="color" id="color-picker" value="#FFA500">
                    <div id="color-label">Choose your honey color</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, honeyJar, honeyMaterial;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let interactionCount = 0;
        let hasInteracted = false;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.background = null; // Make background transparent

            // Camera setup
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 5;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffa500, 0.5);
            pointLight.position.set(-5, 3, 2);
            scene.add(pointLight);

            // Create honey jar
            createHoneyJar();

            // Event listeners
            setupEventListeners();

            // Animation loop
            animate();
        }

        function createHoneyJar() {
            // Create a group for the honey jar
            honeyJar = new THREE.Group();

            // Jar body (cylinder with glass material)
            const jarGeometry = new THREE.CylinderGeometry(1, 1.2, 2.5, 32);
            const jarMaterial = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                roughness: 0.1,
                metalness: 0.1,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
            });
            const jar = new THREE.Mesh(jarGeometry, jarMaterial);
            jar.castShadow = true;
            honeyJar.add(jar);

            // Honey inside (smaller cylinder)
            const honeyGeometry = new THREE.CylinderGeometry(0.9, 1.1, 2.2, 32);
            honeyMaterial = new THREE.MeshStandardMaterial({
                color: 0xFFA500,
                transparent: true,
                opacity: 0.85,
                roughness: 0.3,
                metalness: 0.2,
            });
            const honey = new THREE.Mesh(honeyGeometry, honeyMaterial);
            honey.position.y = -0.1;
            honeyJar.add(honey);

            // Jar lid (cylinder)
            const lidGeometry = new THREE.CylinderGeometry(1.1, 1.1, 0.3, 32);
            const lidMaterial = new THREE.MeshStandardMaterial({
                color: 0xD4AF37,
                roughness: 0.4,
                metalness: 0.8,
            });
            const lid = new THREE.Mesh(lidGeometry, lidMaterial);
            lid.position.y = 1.4;
            lid.castShadow = true;
            honeyJar.add(lid);

            // Lid knob (sphere)
            const knobGeometry = new THREE.SphereGeometry(0.2, 16, 16);
            const knob = new THREE.Mesh(knobGeometry, lidMaterial);
            knob.position.y = 1.7;
            honeyJar.add(knob);

            // Add label (plane)
            const labelGeometry = new THREE.PlaneGeometry(1.5, 0.8);
            const labelMaterial = new THREE.MeshBasicMaterial({
                color: 0xFFF8DC,
                side: THREE.DoubleSide,
            });
            const label = new THREE.Mesh(labelGeometry, labelMaterial);
            label.position.z = 1.01;
            label.position.y = 0;
            honeyJar.add(label);

            // Add text to label (using a simple shape)
            const textGeometry = new THREE.PlaneGeometry(1.2, 0.3);
            const textMaterial = new THREE.MeshBasicMaterial({
                color: 0x8B4513,
                side: THREE.DoubleSide,
            });
            const text = new THREE.Mesh(textGeometry, textMaterial);
            text.position.z = 1.02;
            text.position.y = 0.1;
            honeyJar.add(text);

            scene.add(honeyJar);

            // Initial rotation for better view
            honeyJar.rotation.y = 0.5;
        }

        function setupEventListeners() {
            const canvas = renderer.domElement;

            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseUp);

            // Touch events for mobile
            canvas.addEventListener('touchstart', onTouchStart);
            canvas.addEventListener('touchmove', onTouchMove);
            canvas.addEventListener('touchend', onTouchEnd);

            // Color picker
            document.getElementById('color-picker').addEventListener('input', onColorChange);

            // Window resize
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseDown(event) {
            isDragging = true;
            previousMousePosition = {
                x: event.clientX,
                y: event.clientY
            };
        }

        function onMouseMove(event) {
            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;

                honeyJar.rotation.y += deltaX * 0.01;
                honeyJar.rotation.x += deltaY * 0.01;

                previousMousePosition = {
                    x: event.clientX,
                    y: event.clientY
                };

                registerInteraction();
            }
        }

        function onMouseUp() {
            isDragging = false;
        }

        function onTouchStart(event) {
            if (event.touches.length === 1) {
                isDragging = true;
                previousMousePosition = {
                    x: event.touches[0].clientX,
                    y: event.touches[0].clientY
                };
            }
        }

        function onTouchMove(event) {
            if (isDragging && event.touches.length === 1) {
                const deltaX = event.touches[0].clientX - previousMousePosition.x;
                const deltaY = event.touches[0].clientY - previousMousePosition.y;

                honeyJar.rotation.y += deltaX * 0.01;
                honeyJar.rotation.x += deltaY * 0.01;

                previousMousePosition = {
                    x: event.touches[0].clientX,
                    y: event.touches[0].clientY
                };

                registerInteraction();
            }
        }

        function onTouchEnd() {
            isDragging = false;
        }

        function registerInteraction() {
            if (!hasInteracted) {
                hasInteracted = true;
                unlockFeatures();
            }
            interactionCount++;
            updateInteractionCounter();
        }

        function unlockFeatures() {
            const featuresPanel = document.getElementById('features-panel');
            featuresPanel.classList.add('active');
        }

        function updateInteractionCounter() {
            document.getElementById('interaction-count').textContent = interactionCount;
        }

        function onColorChange(event) {
            const color = event.target.value;
            honeyMaterial.color.set(color);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Gentle floating animation when not dragging
            if (!isDragging) {
                honeyJar.position.y = Math.sin(Date.now() * 0.001) * 0.1;
                honeyJar.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        // Initialize the scene when the page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
